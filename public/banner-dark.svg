<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <!-- Gradient for accents -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00aa;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle background glow -->
    <radialGradient id="bgGlow" cx="25%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.07" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0" />
    </radialGradient>
    
    <!-- Secondary glow -->
    <radialGradient id="bgGlow2" cx="75%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:#ff00aa;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1584" height="396" fill="#0a0a0f"/>
  
  <!-- Subtle glow effects -->
  <rect width="1584" height="396" fill="url(#bgGlow)"/>
  <rect width="1584" height="396" fill="url(#bgGlow2)"/>
  
  <!-- Decorative shapes (left side, floating elements) -->
  <!-- Circles -->
  <circle cx="80" cy="60" r="20" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.25"/>
  <circle cx="200" cy="320" r="30" fill="none" stroke="#ff00aa" stroke-width="1" opacity="0.2"/>
  <circle cx="120" cy="200" r="15" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.15"/>
  
  <!-- Squares (rotated) -->
  <rect x="300" y="50" width="25" height="25" fill="none" stroke="#ff00aa" stroke-width="1" opacity="0.2" transform="rotate(45 312.5 62.5)"/>
  <rect x="60" y="300" width="18" height="18" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2" transform="rotate(45 69 309)"/>
  
  <!-- Triangles -->
  <polygon points="250,150 265,125 280,150" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.18"/>
  <polygon points="150,350 165,325 180,350" fill="none" stroke="#ff00aa" stroke-width="1" opacity="0.18"/>
  
  <!-- Sparkles -->
  <path d="M350,100 L353,112 L365,115 L353,118 L350,130 L347,118 L335,115 L347,112 Z" fill="#00d4ff" opacity="0.25"/>
  <path d="M100,140 L102,148 L110,150 L102,152 L100,160 L98,152 L90,150 L98,148 Z" fill="#ff00aa" opacity="0.2"/>
  
  <!-- Accent line at bottom -->
  <rect x="0" y="392" width="1584" height="4" fill="url(#accentGradient)" opacity="0.7"/>
  
  <!-- Text content (right-aligned, ~600px from right) -->
  <g>
    <!-- Main text -->
    <text x="1050" y="170" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="700" fill="#f0f0f5" letter-spacing="-0.5" text-anchor="end">Ideando soluciones,</text>
    <text x="1050" y="220" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="700" fill="#f0f0f5" letter-spacing="-0.5" text-anchor="end">programando realidades.</text>
    
    <!-- Divider line -->
    <rect x="830" y="245" width="100" height="2" fill="url(#accentGradient)" opacity="0.5"/>
    
    <!-- URL -->
    <text x="1050" y="280" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#6b6b80" text-anchor="end" letter-spacing="0.5">https://kevin-villatoro-dev.github.io/</text>
  </g>
  
  <!-- KAVA brand mark (subtle, top right) -->
  <g opacity="0.35">
    <text x="1530" y="40" font-family="monospace" font-size="16" font-weight="bold" fill="url(#accentGradient)" text-anchor="end">KAVA</text>
  </g>
</svg>
